<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | Krescendo</title><link rel="stylesheet" href="checkout.css?v=14"></head><body class="account-page">
<main class="auth-card"><a class="wordmark" href="index.html"><img src="krescendo-logo.png" alt="Krescendo"></a><p class="eyebrow">MI CUENTA</p><h1 id="authTitle">Iniciar sesión</h1><p class="muted">Accede para guardar tus datos y continuar tu compra.</p>
<form id="authForm"><label id="inviteLabel" hidden>Clave de invitación<input id="inviteCode" autocomplete="off" placeholder="KRS-XXXX-XXXX"></label><label>Correo<input id="email" type="email" autocomplete="email" required></label><label>Contraseña<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button id="authSubmit" class="primary">Entrar</button></form>
<p id="authMessage" class="message" role="status"></p><button id="toggleMode" class="text-button">¿Primera vez? Crear una cuenta</button><a class="back" href="index.html">← Volver a la tienda</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=10"></script><script src="account.js?v=10"></script></body></html>
