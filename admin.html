<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · Krescendo</title><link rel="stylesheet" href="admin.css"></head><body><section id="setup" class="gate hidden"><div class="gate-card"><h1>Krescendo</h1><h2>Conecta Supabase</h2><p>Completa dist/config.js y vuelve a publicar.</p></div></section><section id="auth" class="gate hidden"><form id="authForm" class="gate-card"><h1>Krescendo</h1><small>ADMINISTRACIÓN</small><h2>Iniciar sesión</h2><label>Correo<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" minlength="8" required></label><button>Entrar</button><p id="authError"></p></form></section><section id="dashboard" class="hidden"><aside><h1>Krescendo</h1><small>ADMINISTRACIÓN</small><nav><button class="active" data-view="products">Productos</button><button data-view="categories">Categorías</button><a href="/" target="_blank">Ver tienda ↗</a></nav><button id="signOut">Cerrar sesión</button></aside><main><header><div><small>CATÁLOGO</small><h1 id="viewTitle">Productos</h1></div><button id="newProduct">+ Nuevo producto</button></header><div class="stats"><article><span>Total</span><b id="statTotal">0</b></article><article><span>En stock</span><b id="statStock">0</b></article><article><span>Preventas</span><b id="statPre">0</b></article><article><span>Agotados</span><b id="statOut">0</b></article></div><section id="productsView" class="panel"><div class="toolbar"><input id="search" placeholder="Buscar producto"><select id="statusFilter"><option value="all">Todos</option><option value="stock">En stock</option><option value="preorder">Preventa</option></select></div><table><thead><tr><th>Producto</th><th>Categoría</th><th>Estado</th><th>Precio</th><th>Stock</th><th></th></tr></thead><tbody id="productRows"></tbody></table></section><section id="categoriesView" class="panel hidden"><form id="categoryForm"><input id="categoryName" placeholder="Nueva categoría" required><button>Agregar</button></form><div id="categoryList"></div></section></main></section><dialog id="productDialog"><form id="productForm"><button type="button" class="close">×</button><small id="formMode">NUEVO</small><h2>Producto</h2><input type="hidden" id="productId"><div class="form-grid"><label class="wide">Nombre<input id="name" required></label><label>Artista<input id="artist" required></label><label>Categoría<select id="category" required></select></label><label>Precio<input id="price" type="number" min="0" required></label><label>Stock<input id="stock" type="number" min="0" required></label><label>Tipo<select id="status"><option value="stock">En stock</option><option value="preorder">Preventa</option></select></label><label>Color<input id="color" type="color" value="#ffe4ee"></label><label class="wide">URL de imagen<input id="imageUrl" type="url"></label><label>Fin preventa<input id="preorderClose" type="date"></label><label>Entrega<input id="eta"></label><label class="wide"><input id="active" type="checkbox" checked> Visible</label></div><footer><button type="button" class="cancel">Cancelar</button><button type="submit">Guardar</button></footer><p id="formError"></p></form></dialog><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
