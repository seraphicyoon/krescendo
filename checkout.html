<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar compra | Krescendo</title><link rel="stylesheet" href="checkout.css?v=14"></head><body>
<header class="checkout-header"><a class="wordmark" href="index.html"><img src="krescendo-logo.png" alt="Krescendo"></a><span>Compra segura</span></header><main class="checkout-layout"><section><p class="eyebrow">FINALIZAR COMPRA</p><h1>¿A dónde enviamos tu pedido?</h1><form id="shippingForm" class="shipping-form"><label>Nombre completo<input name="full_name" required></label><label>Teléfono<input name="phone" inputmode="tel" required></label><label class="wide">Calle y número<input name="address_line1" required></label><label>Colonia<input name="neighborhood" required></label><label>Código postal<input name="postal_code" inputmode="numeric" required></label><label>Ciudad<input name="city" required></label><label>Estado<input name="state" required></label><label class="wide">Referencias de entrega<textarea name="notes" rows="3"></textarea></label><fieldset class="wide"><legend>Método de pago</legend><label class="payment-choice"><input type="radio" checked> Transferencia bancaria</label><small>Al crear el pedido verás los datos bancarios y tu referencia.</small></fieldset><button class="primary wide" id="placeOrder">Crear pedido</button><p id="checkoutMessage" class="message wide" role="status"></p></form><section id="success" class="success" hidden></section></section><aside class="summary"><h2>Tu pedido</h2><div id="checkoutItems"></div><div class="summary-total"><span>Total</span><strong id="checkoutTotal"></strong></div><small>El envío se confirmará por separado si aplica.</small></aside></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=10"></script><script src="checkout.js?v=10"></script></body></html>
